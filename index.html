<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Stock Check — Cabitan NHS</title>
<link rel="icon" type="image/png" href="school-logo.png">
<!--
  DEPLOYING TO GITHUB PAGES:
  1. Rename this file to index.html and upload it to your GitHub repo
     (this is the staff-facing tool: check stock, sign in, log In/Out).
  2. Repo Settings -> Pages -> Source: Deploy from a branch -> main -> / (root).
  3. Your live URL will be https://yourusername.github.io/your-repo-name/
  4. Open it on a phone, tap "Connection settings," paste your Supabase
     project URL and anon key, then "Add to Home Screen" for quick access.
  5. Uses localStorage to remember your connection settings and sign-in
     session on that device -- works fine on GitHub Pages (unlike Claude's
     artifact sandbox, which needed a different storage API).

  PENDING REQUESTS: "Log Out" on an item here writes a row to the
  item_requests table instead of moving stock right away -- an admin has
  to open "Pending Requests" and Mark Fulfilled (or Remove) before stock
  actually changes. This page and dashboard.html BOTH read/write the same
  item_requests table, so they share one schema -- see the SQL and
  migration notes in dashboard.html's top comment for the create-table /
  RLS policy statements.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233D; --paper:#FAF7F0; --paper-raised:#FFFFFF; --slate:#64748B; --hair:#E4DFD3;
    --green:#2F7A4D; --green-bg:#E8F3EC;
    --amber:#C77C1D; --amber-bg:#FBEEDC;
    --rust:#B4402A; --rust-bg:#F8E8E4;
    --blue:#2E5AAC; --blue-bg:#E7EDF9;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-tap-highlight-color:transparent;}
  .app{width:100%; max-width:1400px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header{position:sticky; top:0; z-index:10; background:var(--ink); color:var(--paper); padding:18px 18px 14px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8FA3C9; margin:0 0 4px;}
  .title-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:40px; height:36px; object-fit:cover; border-radius:8px; border:1px solid #2A3B5C;}
  h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; margin:0; letter-spacing:-0.01em;}
  #authControl{font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:right;}
  #authControl button{background:none; border:1px solid #2A3B5C; color:var(--paper); border-radius:99px; padding:5px 11px; cursor:pointer; font-family:inherit; font-size:11px;}
  .auth-name{display:block; color:#8FA3C9; margin-bottom:4px; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .search-row{display:flex; gap:8px;}
  #search{flex:1; font-family:'Inter',sans-serif; font-size:15px; padding:11px 14px; border-radius:10px; border:1px solid #2A3B5C; background:#1F3050; color:var(--paper); outline:none;}
  #search::placeholder{color:#7C8FB5;}
  #search:focus{border-color:#8FA3C9;}
  #refreshBtn{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; border:1px solid #2A3B5C; background:#1F3050; color:var(--paper); border-radius:10px; padding:0 14px; cursor:pointer;}
  #refreshBtn:active{transform:scale(0.96);}
  .meta-row{display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8FA3C9;}
  #settingsToggle{background:none; border:none; color:#8FA3C9; font-family:'IBM Plex Mono',monospace; font-size:11px; cursor:pointer; text-decoration:underline; padding:0;}

  #settingsPanel{display:none; background:#1F3050; padding:14px 18px; color:var(--paper);}
  #settingsPanel.open{display:block;}
  #settingsPanel label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8FA3C9; margin:10px 0 4px;}
  #settingsPanel input{width:100%; font-family:'IBM Plex Mono',monospace; font-size:13px; padding:9px 10px; border-radius:8px; border:1px solid #2A3B5C; background:#16233D; color:var(--paper); outline:none;}
  #settingsPanel .hint{font-size:12px; color:#8FA3C9; margin-top:10px; line-height:1.5;}
  #saveSettings{margin-top:12px; width:100%; padding:10px; border:none; border-radius:8px; background:var(--paper); color:var(--ink); font-weight:600; cursor:pointer;}

  main{flex:1; padding:14px 14px 40px;}
  #status{text-align:center; padding:40px 20px; color:var(--slate); font-size:14px; line-height:1.6;}
  .list{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; align-items:start;}
  .card{position:relative; background:var(--paper-raised); border:1px solid var(--hair); border-radius:12px; padding:14px 16px 14px 30px; animation:rise .28s ease backwards;}
  .list .card:nth-child(n){animation-delay:calc(var(--i, 0) * 18ms);}
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .card::before{content:""; position:absolute; left:12px; top:20px; width:7px; height:7px; border-radius:50%; background:var(--paper); border:2px solid var(--hair);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px; line-height:1.25;}
  .card-cat{font-size:12px; color:var(--slate); margin-top:2px;}
  .qty{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:19px; white-space:nowrap;}
  .card-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .badge{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:99px;}
  .badge.ok{background:var(--green-bg); color:var(--green);}
  .badge.low{background:var(--amber-bg); color:var(--amber);}
  .badge.critical{background:var(--rust-bg); color:var(--rust);}
  .updated{font-size:11px; color:var(--slate);}

  .log-row{display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--hair);}
  .log-btn{flex:1; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:.03em; border-radius:8px; padding:8px 0; cursor:pointer; border:none;}
  .log-btn.in{background:var(--green-bg); color:var(--green);}
  .log-btn.out{background:var(--rust-bg); color:var(--rust);}
  .log-btn:active{transform:scale(0.97);}
  .signin-hint{font-size:12px; color:var(--slate); margin-top:12px; padding-top:12px; border-top:1px dashed var(--hair); text-align:center;}
  .signin-hint a{color:var(--blue); cursor:pointer; text-decoration:underline;}

  .empty{text-align:center; padding:60px 20px; color:var(--slate); font-size:14px;}
  footer{text-align:center; padding:16px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--slate); letter-spacing:.03em;}

  /* ---------- Modal (shared: sign-in + log transaction) ---------- */
  .overlay{display:none; position:fixed; inset:0; background:rgba(22,35,61,.55); z-index:50; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{width:100%; max-width:520px; background:var(--paper-raised); border-radius:16px 16px 0 0; padding:22px 20px 26px; animation:slideup .22s ease;}
  @keyframes slideup{ from{transform:translateY(16px); opacity:0;} to{transform:none; opacity:1;} }
  .sheet h2{font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 4px;}
  .sheet .sub{font-size:12.5px; color:var(--slate); margin:0 0 16px;}
  .sheet label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate); margin:12px 0 4px;}
  .sheet input, .sheet select{width:100%; font-family:'Inter',sans-serif; font-size:15px; padding:10px 12px; border-radius:9px; border:1px solid var(--hair); background:var(--paper); color:var(--ink); outline:none;}
  .sheet input:focus, .sheet select:focus{border-color:var(--blue);}
  .sheet-actions{display:flex; gap:10px; margin-top:20px;}
  .sheet-actions button{flex:1; padding:11px 0; border-radius:9px; border:none; font-weight:600; cursor:pointer; font-size:14px;}
  .btn-cancel{background:var(--paper); color:var(--slate); border:1px solid var(--hair) !important;}
  .btn-confirm{background:var(--ink); color:var(--paper);}
  .sheet-error{color:var(--rust); font-size:12.5px; margin-top:10px; display:none;}
  .request-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--hair);}
  .request-row:last-child{border-bottom:none;}
  .request-meta{font-size:13px;}
  .request-meta .name{font-family:'Space Grotesk',sans-serif; font-weight:600;}
  .request-meta .sub{font-size:11.5px; color:var(--slate); margin-top:1px;}
  .fulfill-btn{background:var(--green-bg); color:var(--green); border:none; border-radius:8px; padding:8px 14px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .fulfill-btn:active{transform:scale(0.96);}
  .request-actions{display:flex; gap:8px; flex-shrink:0;}
  .remove-btn{background:var(--rust-bg); color:var(--rust); border:none; border-radius:8px; padding:8px 14px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .remove-btn:active{transform:scale(0.96);}

  /* ---------- Login gate ---------- */
  #gateScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{width:100%; max-width:420px; background:var(--paper-raised); border-radius:18px; overflow:hidden; box-shadow:0 18px 40px rgba(22,35,61,.16); animation:rise .3s ease backwards;}
  .gate-hero{background:linear-gradient(135deg, var(--ink), var(--green)); color:var(--paper); padding:34px 24px 28px; text-align:center;}
  .gate-logo{width:76px; height:76px; border-radius:50%; object-fit:cover; border:3px solid rgba(255,255,255,.35); margin-bottom:12px;}
  .gate-hero h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; margin:0 0 4px;}
  .gate-hero p{margin:0; font-size:12.5px; color:#CFE0D6; font-family:'IBM Plex Mono',monospace; letter-spacing:.03em;}
  .gate-form{padding:26px 24px 24px;}
  .gate-form label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--slate); margin:14px 0 6px;}
  .gate-form label:first-child{margin-top:0;}
  .gate-form input{width:100%; font-family:'Inter',sans-serif; font-size:15px; padding:11px 13px; border-radius:9px; border:1px solid var(--hair); background:var(--paper); color:var(--ink); outline:none;}
  .gate-form input:focus{border-color:var(--blue);}
  .gate-btn{width:100%; margin-top:20px; padding:13px 0; border:none; border-radius:10px; background:linear-gradient(135deg, var(--ink), var(--green)); color:#fff; font-weight:600; font-size:15px; cursor:pointer;}
  .gate-btn:active{transform:scale(0.98);}
  .gate-error{color:var(--rust); font-size:12.5px; margin-top:12px; display:none;}
  .gate-settings-toggle{display:block; text-align:center; margin-top:16px; font-size:12px; color:var(--slate); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit;}
  #gateSettingsPanel{display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--hair);}
  #gateSettingsPanel.open{display:block;}
  #gateSettingsPanel label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate); margin:10px 0 4px;}
  #gateSettingsPanel input{width:100%; font-family:'IBM Plex Mono',monospace; font-size:13px; padding:9px 10px; border-radius:8px; border:1px solid var(--hair); background:var(--paper); color:var(--ink); outline:none;}
  #gateSettingsPanel .hint{font-size:11.5px; color:var(--slate); margin-top:10px; line-height:1.5;}
  #gateSaveSettings{margin-top:12px; width:100%; padding:10px; border:none; border-radius:8px; background:var(--ink); color:var(--paper); font-weight:600; cursor:pointer;}

  /* ---------- Hub (landing after sign-in) ---------- */
  #hubScreen{min-height:100vh; display:flex; flex-direction:column;}
  .hub-header{background:var(--ink); color:var(--paper); padding:18px 22px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .hub-header .brand-row{display:flex; align-items:center; gap:10px;}
  .hub-header .brand-logo{width:38px; height:34px; object-fit:cover; border-radius:8px; border:1px solid #2A3B5C;}
  .hub-header h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; margin:0;}
  .hub-header .eyebrow{margin:0 0 2px;}
  #hubAuthControl{font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:right;}
  #hubAuthControl span{display:block; color:#8FA3C9; margin-bottom:4px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #hubAuthControl button{background:none; border:1px solid #2A3B5C; color:var(--paper); border-radius:99px; padding:5px 11px; cursor:pointer; font-family:inherit; font-size:11px; margin-left:6px;}
  .hub-main{flex:1; padding:36px 20px 40px; max-width:900px; width:100%; margin:0 auto;}
  .hub-welcome{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px; margin:0 0 4px;}
  .hub-sub{color:var(--slate); font-size:13.5px; margin:0 0 26px;}
  .tile-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px;}
  .tile{background:var(--paper-raised); border:1px solid var(--hair); border-radius:16px; padding:26px 18px; text-align:center; cursor:pointer; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; color:var(--ink); transition:transform .12s ease, box-shadow .12s ease;}
  .tile:active{transform:scale(0.97);}
  .tile:hover{box-shadow:0 8px 20px rgba(22,35,61,.1); border-color:#c9c2ae;}
  .tile-icon{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-size:20px;}
  .tile-icon.dash{background:var(--blue-bg); color:var(--blue);}
  .tile-icon.inv{background:var(--green-bg); color:var(--green);}
  .tile-icon.credit{background:var(--amber-bg); color:var(--amber);}
  .tile-note{display:block; font-family:'Inter',sans-serif; font-weight:400; font-size:11.5px; color:var(--slate); margin-top:4px;}

  /* Back-to-hub link shown inside the Inventory screen header */
  #backToHub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8FA3C9; text-decoration:underline; background:none; border:none; cursor:pointer; padding:0;}

  /* ---------- Responsive: fluid from phone to ultra-wide desktop ---------- */
  /* .list above already reflows its own column count to fit any width via
     auto-fill, so no fixed-step breakpoints are needed for the card grid --
     it grows from 1 column on a phone to as many as fit on a large monitor. */
  @media (min-width: 640px){
    header{padding:22px 26px 16px;}
    main{padding:18px 14px 48px;}
    .overlay{align-items:center; padding:24px;}
    .sheet{max-width:440px; border-radius:16px; max-height:85vh; overflow-y:auto;}
  }
  /* Small-phone safety net: tighten spacing and let the header wrap instead
     of clipping on very narrow devices (e.g. older/small phones ~320px). */
  @media (max-width: 380px){
    header{padding:14px 12px 12px;}
    main{padding:10px 8px 32px;}
    h1{font-size:19px;}
    .title-row{flex-wrap:wrap; gap:8px;}
    #authControl{text-align:left;}
    .search-row{flex-wrap:wrap;}
    #refreshBtn{padding:9px 14px;}
  }
</style>
</head>

<script>
// ---------- localStorage-backed shim (portable version) ----------
// Replaces Claude's artifact-only window.storage API with plain
// localStorage, which works in any normal browser -- including inside a
// Google Apps Script Web App's HtmlService page.
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v === null ? null : { value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

// ---------- Default connection (baked into the file) ----------
// This is the SAME anon/public key you'd otherwise type into "Connection
// settings" -- it's safe to ship in the page because it's protected by
// Supabase Row Level Security, not secrecy. Baking it in means ordinary
// staff never see a setup screen; "Connection settings" is still there
// (mainly for you as admin) if you ever need to point the app at a
// different Supabase project.
const DEFAULT_SUPABASE_URL = 'https://yzsnhoqxbmbuuibillch.supabase.co';
const DEFAULT_SUPABASE_KEY = 'sb_publishable_L7ObwFnG5dI1VhyfTgZmZw_sZSKn8FA'; // your project's anon/public key

const $ = (id) => document.getElementById(id);
let session = null;      // { access_token, refresh_token, email }
let connConfig = { url: DEFAULT_SUPABASE_URL, key: DEFAULT_SUPABASE_KEY }; // Supabase project URL + anon key, shared by gate + Manage Staff/Pending Requests

function supaUrl(){ return (connConfig.url || '').trim().replace(/\/$/, ''); }
function supaKey(){ return (connConfig.key || '').trim(); }

// ---------- Screen switching (gate / hub / inventory) ----------
function showScreen(name) {
  $('gateScreen').style.display = name === 'gate' ? '' : 'none';
}

function goToDashboard() {
  window.location.href = 'dashboard.html';
}

// ---------- Persisted settings & session ----------
// This is the PORTABLE version: window.storage above is a small shim over
// localStorage, so this file works as-is on any normal web host --
// Google Apps Script (HtmlService), GitHub Pages, Netlify, your own
// server, etc. No changes needed to deploy it.
function syncConfigInputs() {
  $('gateSupaUrl').value = connConfig.url; $('gateSupaKey').value = connConfig.key;
}

async function loadSettings() {
  // Start from the baked-in default, then let a locally-saved override
  // (set via "Connection settings") take precedence if one exists --
  // this is only expected to be used by admins testing another project.
  connConfig = { url: DEFAULT_SUPABASE_URL, key: DEFAULT_SUPABASE_KEY };
  try {
    const res = await window.storage.get('supabase-config');
    if (res && res.value) {
      const cfg = JSON.parse(res.value);
      if (cfg.url && cfg.key) connConfig = { url: cfg.url, key: cfg.key };
    }
  } catch (e) { /* nothing saved locally, defaults stand */ }
  syncConfigInputs();

  try {
    const res = await window.storage.get('supabase-session');
    if (res && res.value) session = JSON.parse(res.value);
  } catch (e) { /* not signed in */ }

  if (session) {
    goToDashboard();
  } else {
    // Only force the settings panel open if even the baked-in default is
    // missing/unfilled -- normal staff should never hit this.
    if (!connConfig.url || !connConfig.key || connConfig.url.includes('xxxx.supabase.co')) {
      $('gateSettingsPanel').classList.add('open');
    }
    showScreen('gate');
  }
}

async function saveConnConfig(url, key) {
  if (!url || !key) { alert('Please enter both the project URL and the anon key.'); return false; }
  connConfig = { url, key };
  syncConfigInputs();
  try { await window.storage.set('supabase-config', JSON.stringify(connConfig)); }
  catch (e) { console.error('Could not save settings', e); }
  return true;
}

async function saveGateSettings() {
  const ok = await saveConnConfig($('gateSupaUrl').value.trim(), $('gateSupaKey').value.trim());
  if (!ok) return;
  $('gateSettingsPanel').classList.remove('open');
}

async function persistSession() {
  try { await window.storage.set('supabase-session', JSON.stringify(session)); }
  catch (e) { console.error('Could not save session', e); }
}

async function clearSession() {
  session = null;
  try { await window.storage.delete('supabase-session'); } catch (e) {}
  showScreen('gate');
}

// ---------- Auth (Supabase GoTrue REST, no library needed) ----------
async function doSignIn() {
  const email = $('gateEmail').value.trim();
  const password = $('gatePassword').value;
  $('gateError').style.display = 'none';
  if (!supaUrl() || !supaKey()) {
    $('gateError').textContent = 'Set up connection settings first.';
    $('gateError').style.display = 'block';
    $('gateSettingsPanel').classList.add('open');
    return;
  }
  if (!email || !password) return;

  try {
    const res = await fetch(`${supaUrl()}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: supaKey(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Sign in failed');

    session = {
      access_token: data.access_token, refresh_token: data.refresh_token, email,
      isAdmin: data.user?.app_metadata?.is_admin === true,
      name: displayNameFor(data.user, email),
    };
    await persistSession();

    if (data.user?.user_metadata?.must_change_password === true) {
      $('newPasswordError').style.display = 'none';
      $('newPassword1').value = ''; $('newPassword2').value = '';
      openOverlay('newPasswordOverlay');
      return;
    }

    goToDashboard();
  } catch (e) {
    $('gateError').textContent = e.message;
    $('gateError').style.display = 'block';
  }
}

async function doSetNewPassword() {
  const p1 = $('newPassword1').value;
  const p2 = $('newPassword2').value;
  $('newPasswordError').style.display = 'none';

  if (!p1 || p1.length < 8) {
    $('newPasswordError').textContent = 'Password must be at least 8 characters.';
    $('newPasswordError').style.display = 'block';
    return;
  }
  if (p1 !== p2) {
    $('newPasswordError').textContent = 'Passwords do not match.';
    $('newPasswordError').style.display = 'block';
    return;
  }

  try {
    const res = await fetch(`${supaUrl()}/auth/v1/user`, {
      method: 'PUT',
      headers: {
        apikey: supaKey(),
        Authorization: `Bearer ${session.access_token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password: p1, data: { must_change_password: false } }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || 'Could not set new password');

    closeOverlay('newPasswordOverlay');
    goToDashboard();
  } catch (e) {
    $('newPasswordError').textContent = e.message;
    $('newPasswordError').style.display = 'block';
  }
}

async function refreshIfNeeded() {
  // Access tokens expire; if a write fails on auth, try the refresh token once.
  if (!session || !session.refresh_token) return false;
  try {
    const res = await fetch(`${supaUrl()}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: supaKey(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error('expired');
    session = { access_token: data.access_token, refresh_token: data.refresh_token, email: session.email, isAdmin: session.isAdmin, name: session.name };
    await persistSession();
    return true;
  } catch (e) {
    await clearSession();
    return false;
  }
}

// ---------- Overlay helpers ----------
function openOverlay(id) { $(id).classList.add('open'); }
function closeOverlay(id) { $(id).classList.remove('open'); }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// Turns "ivy.buncaras@deped.gov.ph" into "Ivy Buncaras". Splits the local
// part on ., _, - or digits, title-cases each piece, and drops empty
// fragments (stray numbers, double separators).
function deriveNameFromEmail(email) {
  if (!email) return '';
  const local = email.split('@')[0];
  const parts = local.split(/[._\-0-9]+/).filter(Boolean);
  const words = parts.length ? parts : [local];
  return words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}

// Prefer a real name if Supabase ever has one set (user_metadata.full_name
// or .name), otherwise derive one from the email's local part.
function displayNameFor(user, email) {
  const stored = user?.user_metadata?.full_name || user?.user_metadata?.name;
  return (stored && stored.trim()) || deriveNameFromEmail(email);
}

$('gatePassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSignIn(); });
$('gateSettingsToggle').addEventListener('click', () => $('gateSettingsPanel').classList.toggle('open'));
$('gateSaveSettings').addEventListener('click', saveGateSettings);

loadSettings();
